<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microservices one-DB-per-service architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
  </defs>

  <rect x="350" y="16" width="300" height="44" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">API gateway (orchestration)</text>
  <line x1="500" y1="60" x2="500" y2="90" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="560" y="80" font-size="11" fill="#64748b">HTTP + unique ID</text>

  <!-- 4 service boxes -->
  <rect x="60" y="110" width="200" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="160" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">user service :7001</text>
  <text x="160" y="154" text-anchor="middle" font-size="11" fill="#166534">owns: user.json</text>
  <line x1="80" y1="164" x2="240" y2="164" stroke="#bbf7d0"/>
  <text x="160" y="184" text-anchor="middle" font-size="11.5" fill="#1f2937">user_id · name · balance</text>
  <text x="160" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">no order / product data</text>

  <rect x="290" y="110" width="200" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="390" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">product service :7002</text>
  <text x="390" y="154" text-anchor="middle" font-size="11" fill="#166534">owns: product.json</text>
  <line x1="310" y1="164" x2="470" y2="164" stroke="#bbf7d0"/>
  <text x="390" y="184" text-anchor="middle" font-size="11.5" fill="#1f2937">product_id · name · price · stock</text>
  <text x="390" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">no user / order data</text>

  <rect x="520" y="110" width="200" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="620" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">order service :7003</text>
  <text x="620" y="154" text-anchor="middle" font-size="11" fill="#1e40af">owns: order.json</text>
  <line x1="540" y1="164" x2="700" y2="164" stroke="#bfdbfe"/>
  <text x="620" y="184" text-anchor="middle" font-size="11.5" fill="#1f2937">order_id · qty · amount · status</text>
  <text x="620" y="204" text-anchor="middle" font-size="11" fill="#1d4ed8">refs user_id, product_id (ID only)</text>
  <text x="620" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">no names copied into order row</text>

  <rect x="750" y="110" width="200" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="850" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">payment service :7004</text>
  <text x="850" y="154" text-anchor="middle" font-size="11" fill="#b91c1c">owns: payment.json</text>
  <line x1="770" y1="164" x2="930" y2="164" stroke="#fecaca"/>
  <text x="850" y="184" text-anchor="middle" font-size="11.5" fill="#1f2937">payment_id · amount · status</text>
  <text x="850" y="204" text-anchor="middle" font-size="11" fill="#b91c1c">refs order_id, user_id (ID only)</text>

  <!-- gateway to 4 services -->
  <line x1="500" y1="90" x2="160" y2="110" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="500" y1="90" x2="390" y2="110" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="500" y1="90" x2="620" y2="110" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="500" y1="90" x2="850" y2="110" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- join callout -->
  <rect x="60" y="300" width="890" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="505" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Request-time join by ID (no foreign keys, no shared tables)</text>
  <text x="505" y="350" text-anchor="middle" font-size="11.5" fill="#475569">order service GET /orders/{id}/detail  →  calls user service by user_id + product service by product_id to assemble names</text>
  <text x="505" y="370" text-anchor="middle" font-size="11.5" fill="#64748b">Each DB only knows its own rows. Cross-service data is fetched on demand, never stored duplicated.</text>

  <text x="500" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Order flow (gateway chains by ID):</text>
  <text x="500" y="455" text-anchor="middle" font-size="11.5" fill="#475569">create order → deduct user balance → deduct product stock → record payment → mark order PAID</text>
  <text x="500" y="480" text-anchor="middle" font-size="11.5" fill="#b45309">if stock fails after balance deducted: gateway refunds balance (best-effort compensation, no distributed txn)</text>
</svg>
</body>
</html>
