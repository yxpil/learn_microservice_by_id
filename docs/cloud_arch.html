<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud-drive microservice architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>

  <!-- clients -->
  <rect x="40" y="20" width="180" height="46" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Clients</text>
  <text x="130" y="57" text-anchor="middle" font-size="11" fill="#b45309">web · mobile · open API</text>
  <line x1="220" y1="43" x2="290" y2="43" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- gateway -->
  <rect x="290" y="18" width="200" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="390" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">API Gateway / Glue</text>
  <text x="390" y="57" text-anchor="middle" font-size="10.5" fill="#475569">routing · composition · retry · trace-id</text>

  <!-- event bus -->
  <rect x="700" y="18" width="220" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="810" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Event Bus / MQ</text>
  <text x="810" y="57" text-anchor="middle" font-size="10.5" fill="#7c3aed">async integration · at-least-once</text>

  <!-- services row -->
  <g font-size="11.5">
    <rect x="40" y="130" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="115" y="152" text-anchor="middle" font-weight="700" fill="#15803d">user service</text>
    <text x="115" y="172" text-anchor="middle" fill="#1f2937">account · profile</text>
    <text x="115" y="190" text-anchor="middle" fill="#1f2937">quota · billing</text>
    <text x="115" y="218" text-anchor="middle" font-size="10" fill="#64748b">own: user DB</text>

    <rect x="205" y="130" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="280" y="152" text-anchor="middle" font-weight="700" fill="#15803d">file metadata</text>
    <text x="280" y="172" text-anchor="middle" fill="#1f2937">folder tree</text>
    <text x="280" y="190" text-anchor="middle" fill="#1f2937">size · owner · path</text>
    <text x="280" y="218" text-anchor="middle" font-size="10" fill="#64748b">own: metadata DB</text>

    <rect x="370" y="130" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="445" y="152" text-anchor="middle" font-weight="700" fill="#15803d">block storage</text>
    <text x="445" y="172" text-anchor="middle" fill="#1f2937">raw bytes</text>
    <text x="445" y="190" text-anchor="middle" fill="#1f2937">dedup · CDN</text>
    <text x="445" y="218" text-anchor="middle" font-size="10" fill="#64748b">own: object store</text>

    <rect x="535" y="130" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="610" y="152" text-anchor="middle" font-weight="700" fill="#15803d">share service</text>
    <text x="610" y="172" text-anchor="middle" fill="#1f2937">links · permission</text>
    <text x="610" y="190" text-anchor="middle" fill="#1f2937">revoke · expiry</text>
    <text x="610" y="218" text-anchor="middle" font-size="10" fill="#64748b">own: share DB</text>

    <rect x="700" y="130" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="775" y="152" text-anchor="middle" font-weight="700" fill="#15803d">search service</text>
    <text x="775" y="172" text-anchor="middle" fill="#1f2937">inverted index</text>
    <text x="775" y="190" text-anchor="middle" fill="#1f2937">full-text · tag</text>
    <text x="775" y="218" text-anchor="middle" font-size="10" fill="#64748b">own: ES index</text>

    <rect x="865" y="130" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="940" y="152" text-anchor="middle" font-weight="700" fill="#15803d">preview service</text>
    <text x="940" y="172" text-anchor="middle" fill="#1f2937">transcode · thumb</text>
    <text x="940" y="190" text-anchor="middle" fill="#1f2937">AV scan · watermark</text>
    <text x="940" y="218" text-anchor="middle" font-size="10" fill="#64748b">own: render cache</text>
  </g>

  <!-- gateway to services -->
  <line x1="390" y1="68" x2="115" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="68" x2="280" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="68" x2="445" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="68" x2="610" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="68" x2="775" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="390" y1="68" x2="940" y2="130" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- event bus to services (async) -->
  <line x1="810" y1="68" x2="775" y2="130" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <line x1="810" y1="68" x2="940" y2="130" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrD)"/>
  <line x1="810" y1="68" x2="280" y2="130" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrD)"/>

  <!-- principles -->
  <rect x="40" y="290" width="980" height="120" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="530" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Hard rules</text>
  <text x="60" y="342" font-size="12" fill="#334155">• One service = one process = one DB. No service writes another service's tables. No cross-DB foreign keys.</text>
  <text x="60" y="364" font-size="12" fill="#334155">• Sync path: client → gateway → services by HTTP + ID. Async path: services → event bus → subscribers (search index, audit, AI).</text>
  <text x="60" y="386" font-size="12" fill="#334155">• New feature = new service + new DB, chained by existing IDs. Old services untouched. Example: add watermark = new service, not a branch in download.</text>

  <text x="530" y="460" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Trade-off</text>
  <text x="60" y="486" font-size="12" fill="#334155">Gain: independent scaling / deploy / tech choice / failure isolation / easy feature expansion.</text>
  <text x="60" y="508" font-size="12" fill="#334155">Cost: distributed complexity, RPC latency, ops N×, debug needs trace-id. Mitigate: idempotency, at-least-once + idempotent consumers, reconciliation.</text>
</svg>
</body>
</html>
